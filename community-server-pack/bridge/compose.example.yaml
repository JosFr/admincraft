services:
  admincraft-bridge:
    build: .
    image: admincraft-websocket-community:1.3.0-rc3
    container_name: admincraft-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      SERVER_TYPE: java
      RCON_HOST: ${RCON_HOST:-127.0.0.1}
      RCON_PORT: ${RCON_PORT:-25575}
      DOCKER_ENABLED: "false"
      MULTICRAFT_ENABLED: ${MULTICRAFT_ENABLED:-false}
      NETWORK_API_URL: ${NETWORK_API_URL:-}
      ACCESS_API_URL: ${ACCESS_API_URL:-}
    ports:
      - "127.0.0.1:${BRIDGE_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ${APNS_KEY_DIR:-./apns}:/run/admincraft-apns:ro
