name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - rc4

permissions:
  contents: read

jobs:
  app-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install -r requirements-docs.txt
      - name: Analyze
        run: |
          set +e
          output="$(flutter analyze --machine 2>&1)"
          status=$?
          while IFS='|' read -r severity type code file line column length message; do
            level=notice
            [ "$severity" = "ERROR" ] && level=error
            [ "$severity" = "WARNING" ] && level=warning
            if [ -n "$file" ] && [ -n "$line" ]; then
              echo "::$level file=$file,line=$line,col=$column::$message ($code)"
            fi
          done <<< "$output"
          printf '%s\n' "$output"
          exit "$status"
      - name: Test controllers
        run: flutter test test/controllers
      - name: Test models
        run: flutter test test/models
      - name: Test services
        run: flutter test test/services
      - name: Test utilities
        run: flutter test test/utils
      - name: Test workspace shell
        run: flutter test test/views/tabs_view_test.dart
      - name: Test view components
        run: |
          flutter test             test/views/control_tab_view_test.dart             test/views/data_sync_view_test.dart             test/views/overview_view_test.dart             test/views/players_view_test.dart             test/views/server_editor_view_test.dart             test/views/server_icon_test.dart             test/views/terminal_tab_view_test.dart
      - name: Build documentation
        run: python -m mkdocs build --strict
