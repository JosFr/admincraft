name: Quality

on:
  pull_request:
  push:
    branches:
      - develop
      - rc4

permissions:
  contents: read

jobs:
  app-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/websocket/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install dependencies
        run: |
          flutter pub get
          python -m pip install -r requirements-docs.txt
      - name: Analyze
        run: |
          set +e
          output="$(flutter analyze --machine 2>&1)"
          status=$?
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::error::$line"
          done <<< "$output"
          printf '%s\n' "$output"
          exit "$status"
      - name: Test controllers
        run: flutter test test/controllers
      - name: Test models
        run: flutter test test/models
      - name: Test services
        run: flutter test test/services
      - name: Test utilities
        run: flutter test test/utils
      - name: Test workspace shell
        run: |
          set +e
          flutter test test/views/tabs_view_test.dart --reporter expanded 2>&1 | tee /tmp/workspace-shell.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            failure_line="$(grep -n -m 1 'EXCEPTION CAUGHT BY FLUTTER TEST FRAMEWORK' /tmp/workspace-shell.log | cut -d: -f1)"
            if [ -n "$failure_line" ]; then
              start=$((failure_line > 30 ? failure_line - 30 : 1))
              end=$((failure_line + 100))
              details="$(sed -n "${start},${end}p" /tmp/workspace-shell.log)"
            else
              details="$(tail -n 160 /tmp/workspace-shell.log)"
            fi
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            echo "::error::$details"
          fi
          exit "$status"
      - name: Test view components
        run: |
          flutter test             test/views/control_tab_view_test.dart             test/views/data_sync_view_test.dart             test/views/overview_view_test.dart             test/views/players_view_test.dart             test/views/server_editor_view_test.dart             test/views/server_icon_test.dart             test/views/terminal_tab_view_test.dart
      - name: Test RC4 WebSocket backend
        working-directory: server/websocket
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
      - name: Build RC4 WebSocket image
        run: docker build --tag admincraft-websocket:rc4 server/websocket
      - name: Build documentation
        run: python -m mkdocs build --strict
