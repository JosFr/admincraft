services:
  admincraft-websocket:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - admincraft-management:/data
      # Optional: mount backup destinations and Native source paths.
      # Use read-write only where Native restore/delete is explicitly enabled.
      # - /srv/minecraft/lobby:/minecraft/lobby:ro
      # - /srv/backups:/backups
    environment:
      TZ: Europe/Amsterdam
      SERVER_TYPE: java
      DOCKER_ENABLED: "false"
      SECRET_KEY: CHANGE_ME
      RCON_HOST: lobby
      RCON_PORT: "25575"
      RCON_PASSWORD: CHANGE_ME
      MULTICRAFT_ENABLED: "true"
      MULTICRAFT_URL: https://panel.example.net/api.php
      MULTICRAFT_USER: admincraft
      MULTICRAFT_API_KEY: CHANGE_ME
      MULTICRAFT_SERVER_ID: "1"
      MANAGEMENT_ENABLED: "true"
      MANAGEMENT_STATE_PATH: /data/management-state.json
      # Legacy single local storage path:
      # MANAGEMENT_STORAGE_PATH: /backups
      # First-class storage/engine config (examples below):
      BACKUP_STORAGES_JSON: >-
        []
      BACKUP_ENGINES_JSON: >-
        []
      # MANAGEMENT_NATIVE_BACKUP_PATH: /data/native-staging
      # MANAGEMENT_STORAGE_PROBE_MS: "300000"
      MANAGEMENT_SERVERS_JSON: >-
        [{"id":"lobby","name":"Lobby","multicraftServerId":1}]
      # Optional plugin update mappings; keep premium sources explicit.
      UPDATE_PROJECTS_JSON: >-
        []

volumes:
  admincraft-management:
