services:
  admincraft-websocket:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - admincraft-management:/data
      # Optional: mount backup destinations and Native source paths.
      # Use read-write only where Native restore/delete is explicitly enabled.
      # - /srv/minecraft/lobby:/minecraft/lobby:ro
      # - /srv/backups:/backups
    environment:
      TZ: Europe/Amsterdam
      SERVER_TYPE: java
      DOCKER_ENABLED: "false"
      SECRET_KEY: CHANGE_ME
      RCON_HOST: lobby
      RCON_PORT: "25575"
      RCON_PASSWORD: CHANGE_ME
      MULTICRAFT_ENABLED: "true"
      MULTICRAFT_URL: https://panel.example.net/api.php
      MULTICRAFT_USER: admincraft
      MULTICRAFT_API_KEY: CHANGE_ME
      MULTICRAFT_SERVER_ID: "1"
      MANAGEMENT_ENABLED: "true"
      MANAGEMENT_STATE_PATH: /data/management-state.json
      # Legacy single local storage path:
      # MANAGEMENT_STORAGE_PATH: /backups
      # First-class storage/engine config (examples below):
      BACKUP_STORAGES_JSON: >-
        []
      BACKUP_ENGINES_JSON: >-
        []
      # Daily/weekly/monthly retention; deletion is opt-in with enforce=true.
      BACKUP_RETENTION_JSON: >-
        {"global":{"daily":7,"weekly":4,"monthly":6,"enforce":false},"servers":{}}
      # Maintenance countdowns/messages/health checks; server overrides are optional.
      MAINTENANCE_CONFIG_JSON: >-
        {"global":{"countdownOptionsSeconds":[60,300,600,1800],"healthcheckAttempts":12,"healthcheckIntervalSeconds":5},"servers":{}}
      # MANAGEMENT_NATIVE_BACKUP_PATH: /data/native-staging
      # MANAGEMENT_STORAGE_PROBE_MS: "300000"
      MANAGEMENT_SERVERS_JSON: >-
        [{"id":"lobby","name":"Lobby","multicraftServerId":1}]
      # Canonical Minecraft performance history comes from Plan via SELECT-only MariaDB access.
      PLAN_DB_HOST: plan-db.example.net
      PLAN_DB_PORT: "3306"
      PLAN_DB_DATABASE: plan
      PLAN_DB_USER: admincraft_ro
      PLAN_DB_PASSWORD: CHANGE_ME
      PLAN_DB_SSL: "false"
      PLAN_SERVER_MAP_JSON: >-
        [{"serverId":"lobby","planServerName":"Lobby"}]
      # Optional plugin update mappings; keep premium sources explicit.
      UPDATE_PROJECTS_JSON: >-
        []
      # Optional authenticated BuiltByBit v1 version checking:
      # BUILTBYBIT_API_TOKEN: CHANGE_ME
      # BUILTBYBIT_API_TOKEN_TYPE: Private

volumes:
  admincraft-management:
